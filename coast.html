<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lumina Physics · Coast</title>
<style>
*{box-sizing:border-box}html,body,canvas{width:100%;height:100%;margin:0}body{background:#18272b;color:#fff;font:14px system-ui,sans-serif}canvas{display:block;outline:0}aside{position:fixed;bottom:20px;left:20px;padding:14px 17px;max-width:min(550px,calc(100% - 40px));border:1px solid #d4e5df40;background:#132025e8;border-radius:12px}h1{margin:0 0 9px;font-size:18px;font-weight:580}nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}select,button{color:inherit;background:#253438;border:1px solid #647572;border-radius:5px;padding:6px 9px;font:inherit}button{cursor:pointer}button[aria-pressed=true]{background:#dde6db;color:#1d2b2c}p{font-size:12px;color:#d4ded9;margin:10px 0 0}label{display:inline-flex;gap:5px;align-items:center}input{width:66px;accent-color:#d8bb88}
details{margin-top:8px;font-size:12px;color:#d4ded9}summary{cursor:pointer}output{display:block;margin-top:5px}</style></head><body><canvas tabindex="0" aria-label="Playable shoreline"></canvas><aside><h1>Coastal field guide</h1><nav><select id="shore" aria-label="Coast"></select><button data-view="walk">Walk</button><button data-view="drive">Drive</button><button data-view="fly">Fly</button><button data-view="skiff" hidden>Skiff</button><button id="shower" hidden aria-pressed="false">Street shower</button><button id="grate" hidden aria-pressed="false">Block grate</button><button id="cut" hidden>Cut dune</button><button id="flood" hidden>High sea</button><button id="ebb" hidden>Low sea</button><button id="replay">Replay</button><select id="look" aria-label="Art direction"><option value="natural-daylight">Natural daylight</option><option value="painterly">Graphic adventure</option><option value="neon-night">Night noir</option></select><select id="air" aria-label="Air conditions"><option value="">Local air</option></select></nav><p><span id="skiff-controls" hidden><label>Load (kg) <input type="range" id="load-kg" min="0" max="120" value="0"></label> <label>Load across keel (m) <input type="range" id="load-x" min="-.42" max=".42" step=".01" value="0"></label> </span><label>Solar hour <input type="range" id="clock" min="0" max="24" step=".05"></label> <label>Tide range <input type="range" id="tide" min="0" max=".75" step=".01" value=".16"></label> <span id="reading" role="status">Preparing the shore…</span></p><details><summary>Inspect conditions</summary><span id="grain-controls" hidden><button id="inspect-grains" aria-pressed="false">Inspect sand grains</button> <label>Mineral highlights <input type="range" id="facet-strength" min="0" max="1" step=".05" value="1"></label></span><span id="bank-controls" hidden><label>Cloud crown lean (%) <input type="range" id="bank-lean" min="-100" max="150" step="5" value="100"></label> <label>Cloud skylight reach (m) <input type="range" id="bank-sky" min="0" max="300" step="5"></label></span><output id="conditions"></output></details></aside><script type="module" src="/showcase/coast.ts"></script></body></html>
