<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Rain beyond the ridge · Lumina Physics</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body,
      canvas {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      body {
        background: #383433;
        color: #f4f0e7;
        font:
          14px/1.4 system-ui,
          sans-serif;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      aside {
        position: absolute;
        bottom: 16px;
        left: 16px;
        width: min(395px, calc(100vw - 32px));
        padding: 15px 17px;
        background: #232826ef;
        border: 1px solid #928e7e88;
        border-radius: 9px;
      }
      h1 {
        font:
          500 26px/1.2 Georgia,
          serif;
        margin: 0 0 7px;
      }
      nav {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      button {
        font: inherit;
        color: inherit;
        background: #3c413e;
        border: 1px solid #72776f;
        border-radius: 5px;
        padding: 5px 10px;
        cursor: pointer;
      }
      button[aria-pressed='true'] {
        background: #655a49;
        border-color: #d4bd92;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 9px 0;
      }
      input {
        flex: 1;
        min-width: 40px;
        accent-color: #d3ba92;
      }
      p {
        margin: 6px 0 10px;
      }
      output,
      #gauges {
        font-variant-numeric: tabular-nums;
      }
      #gauges {
        font-size: 12px;
        color: #e0dfd6;
        margin: 9px 0 0;
      }
      #wait {
        position: absolute;
        top: 45%;
        text-align: center;
        width: 100%;
      }
      a {
        color: #e1d4b9;
      }
      footer {
        margin-top: 8px;
        font-size: 12px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <canvas tabindex="0" aria-label="Two showers over the desert basin"></canvas>
    <p id="wait" role="status">Preparing the rain survey…</p>
    <aside hidden>
      <h1>Rain beyond the ridge</h1>
      <p>Both clouds release 36 mm/h. Visit each gauge to see what reaches the road.</p>
      <nav aria-label="Viewpoint">
        <button id="ridge" aria-pressed="true">Ridge</button
        ><button id="east" aria-pressed="false">East gauge</button
        ><button id="west" aria-pressed="false">West gauge</button>
      </nav>
      <label
        >East lower-air humidity
        <input id="humidity" type="range" min="10" max="100" step="1" value="18" /><output id="rh"
          >18%</output
        ></label
      >
      <nav><button id="minute">Advance one minute</button><button id="clear">Empty both roads</button></nav>
      <p id="gauges"></p>
      <footer><a href="./">Salt basin</a></footer>
    </aside>
    <script type="module" src="./rain-survey.ts"></script>
  </body>
</html>
