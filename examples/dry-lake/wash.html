<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Low-water crossing · Lumina Physics</title>
    <link rel="stylesheet" href="./survey.css" />
    <style>
      aside {
        max-height: calc(100dvh - 28px);
        overflow: auto;
      }
      nav + nav,
      details {
        margin-top: 8px;
      }
      select {
        font: inherit;
        color: inherit;
        background: #3c413e;
        border: 1px solid #72776f;
        border-radius: 4px;
        padding: 3px 6px;
      }
      summary {
        cursor: pointer;
      }
      #chart {
        width: 100%;
        height: 70px;
        display: block;
        background: #191f20;
        margin: 6px 0;
      }
      #flow,
      #levels,
      #balance {
        font-variant-numeric: tabular-nums;
        font-size: 12px;
      }
      #balance {
        color: #d5d4c8;
      }
      #save-status {
        font-size: 12px;
      }
      .gold {
        color: #e9bd7c;
      }
      .blue {
        color: #92c4db;
      }
      .sage {
        color: #adc4a5;
      }
    </style>
  </head>
  <body>
    <canvas id="world" tabindex="0" aria-label="Surveyed low-water crossing"></canvas>
    <p id="wait" role="status">Preparing the crossing…</p>
    <aside hidden>
      <h1>Low-water crossing</h1>
      <p>A shower passes over three upstream gauges. Watch the dry crossing as the wash arrives.</p>
      <nav>
        <button id="run">Run shower</button><button id="skip">Advance 15 s</button
        ><button id="restart">Restart</button>
      </nav>
      <label
        >Culvert opening <input id="opening" type="range" min="0" max="100" value="100" /><output
          id="aperture"
          >100%</output
        ></label
      >
      <nav>
        <button id="crossing" aria-pressed="true">Road</button
        ><button id="inlet" aria-pressed="false">Inlet</button
        ><button id="outlet" aria-pressed="false">Outlet</button
        ><button id="ridge" aria-pressed="false">Headwaters</button>
      </nav>
      <p id="flow"></p>
      <p id="levels"></p>
      <details>
        <summary>Survey record</summary>
        <label
          >Playback speed
          <select id="speed">
            <option value="1">1×</option>
            <option value="4">4×</option>
            <option selected value="8">8×</option>
            <option value="12">12×</option>
          </select></label
        >
        <p>
          <span class="gold">Inlet</span> · <span class="blue">Road</span> ·
          <span class="sage">Outlet</span> water depth, 0–60 cm
        </p>
        <canvas
          id="chart"
          width="360"
          height="70"
          aria-label="Measured depths since the start of the storm"
        ></canvas>
        <p id="balance"></p>
        <nav><button id="save">Save storm</button><button id="restore" disabled>Restore storm</button></nav>
        <span id="save-status" role="status"></span>
      </details>
      <footer>
        <a href="./rain.html">Rain beyond the ridge</a> · <a href="../../field.html">Landscape field guide</a>
      </footer>
    </aside>
    <script type="module" src="./wash.ts"></script>
  </body>
</html>
