<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Landscape field guide · Lumina Physics</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: #212d2e;
        color: #f5f2e6;
        font:
          14px/1.5 'Helvetica Neue',
          Arial,
          sans-serif;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
        outline: 0;
      }
      #loading {
        position: absolute;
        inset: 45% 0 auto;
        text-align: center;
        pointer-events: none;
      }
      #loading:empty,
      [hidden] {
        display: none !important;
      }
      details {
        position: absolute;
        bottom: 16px;
        left: 16px;
        max-width: min(790px, calc(100vw - 32px));
        background: #182321ee;
        border: 1px solid #a8b7a34a;
        border-radius: 9px;
        box-shadow: 0 7px 35px #10160f28;
      }
      summary {
        cursor: pointer;
        padding: 9px 14px;
        font-weight: 600;
      }
      nav {
        display: flex;
        align-items: end;
        flex-wrap: wrap;
        gap: 8px 12px;
        padding: 0 14px 12px;
      }
      label {
        font-size: 12px;
        color: #d1dbcc;
        display: grid;
        gap: 2px;
      }
      select,
      button {
        font: inherit;
        background: #314039;
        color: inherit;
        border: 1px solid #88998082;
        border-radius: 4px;
        padding: 5px 8px;
      }
      button {
        cursor: pointer;
      }
      input {
        width: 108px;
        accent-color: #dae1bb;
      }
      a {
        color: inherit;
      }
      footer {
        padding: 0 14px 10px;
        color: #d4dfd4;
        font-size: 12px;
      }
      #soil {
        margin: 0 14px 11px;
      }
      button:focus-visible,
      select:focus-visible,
      summary:focus-visible {
        outline: 2px solid #e4c88e;
      }
    </style>
  </head>
  <body>
    <canvas tabindex="0" aria-label="Playable landscape"></canvas>
    <div id="loading" role="status">Growing landscape…</div>
    <details open>
      <summary>Landscape field guide</summary>
      <nav aria-label="Landscape controls">
        <label>Region<select id="region"></select></label
        ><label>Art direction<select id="direction"></select></label
        ><label>View<select id="view"></select></label><label>Season<select id="season"></select></label
        ><label>Sky<select id="sky"></select></label
        ><label>Solar hour <input id="time" type="range" min="0" max="23.9" step=".1" /></label
        ><button id="act"></button><button id="tree">Fell nearby tree</button
        ><button id="inspect">Inspect ground</button>
      </nav>
      <p id="soil" hidden></p>
      <footer>
        Click the scene to steer with WASD or arrow keys. E/Q changes flight altitude.
        <a href="./profiles.html">World profiles</a>
      </footer>
    </details>
    <script type="module" src="/showcase/field-guide.ts"></script>
  </body>
</html>
